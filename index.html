<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuidora</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8e1;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #ffd000, #ff9800);
      padding: 25px 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .productos {
      padding: 20px;
      display: grid;
      gap: 15px;
    }

    .producto {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .producto h3 {
      margin: 0 0 5px;
    }

    .precio {
      font-weight: bold;
      font-size: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #ff9800;
      color: white;
      font-weight: bold;
    }

    #carrito {
      margin: 20px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    #pedido {
      width: 100%;
      margin-top: 15px;
      background: #25D366;
      font-size: 17px;
    }
  </style>
</head>

<body>

<header>
  <h1>Mi Distribuidora</h1>
  <p>Pedidos rápidos y fáciles</p>
</header>

<section class="productos">

  <div class="producto">
    <div>
      <h3>Coca-Cola 2 L</h3>
      <div class="precio">$3.600</div>
    </div>
    <button onclick="agregar('Coca-Cola 2 L', 3600)">Agregar</button>
  </div>

  <div class="producto">
    <div>
      <h3>Quilmes 1 L</h3>
      <div class="precio">$4.000</div>
    </div>
    <button onclick="agregar('Quilmes 1 L', 4000)">Agregar</button>
  </div>

  <div class="producto">
    <div>
      <h3>Brahma 1 L</h3>
      <div class="precio">$4.000</div>
    </div>
    <button onclick="agregar('Brahma 1 L', 4000)">Agregar</button>
  </div>

</section>

<section id="carrito">
  <h2>🛒 Mi pedido</h2>
  <div id="lista">Todavía no agregaste productos.</div>
  <h3 id="total">$0</h3>
  <button id="pedido" onclick="enviarWhatsApp()">
    Pedir por WhatsApp
  </button>
</section>

<script>
  let carrito = [];

  function agregar(nombre, precio) {
    carrito.push({nombre, precio});
    mostrarCarrito();
  }

  function mostrarCarrito() {
    let lista = document.getElementById("lista");
    let total = 0;

    if (carrito.length === 0) {
      lista.innerHTML = "Todavía no agregaste productos.";
      document.getElementById("total").innerText = "$0";
      return;
    }

    lista.innerHTML = carrito.map(p => {
      total += p.precio;
      return `<p>${p.nombre} - $${p.precio.toLocaleString("es-AR")}</p>`;
    }).join("");

    document.getElementById("total").innerText =
      "Total: $" + total.toLocaleString("es-AR");
  }

  function enviarWhatsApp() {
    if (carrito.length === 0) {
      alert("Agregá algún producto primero.");
      return;
    }

    let mensaje = "Hola! Quiero hacer este pedido:%0A%0A";
    let total = 0;

    carrito.forEach(p => {
      mensaje += "• " + p.nombre + " - $" +
        p.precio.toLocaleString("es-AR") + "%0A";
      total += p.precio;
    });

    mensaje += "%0ATotal: $" +
      total.toLocaleString("es-AR");

    window.open(
      "https://wa.me/543415509319?text=" + mensaje,
      "_blank"
    );
  }
</script>

</body>
</html>
